name: Supabase Keep-Alive

# Supabase free-tier projects pause after ~7 days of inactivity. This
# lightweight REST ping every 48 hours keeps the engine warm.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL      → https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY → the project's anon/publishable key

on:
  schedule:
    # Every 2 days at 06:00 UTC (~48h cadence).
    - cron: '0 6 */2 * *'
  workflow_dispatch: {} # allow manual runs for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          echo "Pinging Supabase REST endpoint..."
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/documents?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${status}"
          # 200 = ok; RLS returns an empty array to anon, which still counts
          # as database activity. Anything >= 500 means the instance is down.
          if [ "${status}" -ge 500 ]; then
            echo "Supabase returned a server error:" && cat /tmp/body.txt
            exit 1
          fi
          echo "Keep-alive ping successful."
